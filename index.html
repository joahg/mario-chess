<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🍄 Mario Chess 🏰</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mario-themed chess with a chess clock — full rules, fully playable in your browser. Installable PWA.">
<meta name="theme-color" content="#e63946">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mario Chess">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#5c94fc; --sky2:#9bd1ff;
  --hill:#5fb04a; --hill-dark:#2f7a2a;
  --pipe:#3aaa35; --pipe-dark:#1f6a1c; --pipe-light:#7ee06b;
  --light-sq:#f7d774; --light-sq-edge:#d9b14a;
  --dark-sq:#a0522d; --dark-sq-edge:#6b3a17;
  --gold:#ffcc33; --red:#e63946;
  --hud-bg:#000; --hud-fg:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;font-family:'Press Start 2P', system-ui, -apple-system, "Segoe UI", sans-serif;color:#fff;overflow:hidden}
body{
  background:
    radial-gradient(ellipse at 20% 80%, rgba(95,176,74,.0) 0%, transparent 60%),
    linear-gradient(to bottom, var(--sky1) 0%, var(--sky2) 70%, #b9e87a 70%, #5fb04a 100%);
  position:relative;
}
/* clouds */
.cloud{position:absolute;background:#fff;border-radius:50%;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.1));pointer-events:none}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:120px;height:40px;top:8%;left:5%;animation:drift 60s linear infinite}
.c1::before{width:60px;height:60px;left:15px;top:-25px}
.c1::after{width:50px;height:50px;left:60px;top:-20px}
.c2{width:160px;height:50px;top:18%;right:10%;animation:drift2 80s linear infinite}
.c2::before{width:70px;height:70px;left:20px;top:-30px}
.c2::after{width:60px;height:60px;left:80px;top:-25px}
.c3{width:90px;height:30px;top:35%;left:40%;animation:drift 100s linear infinite}
.c3::before{width:45px;height:45px;left:10px;top:-18px}
.c3::after{width:40px;height:40px;left:45px;top:-15px}
@keyframes drift{0%{transform:translateX(-200px)}100%{transform:translateX(110vw)}}
@keyframes drift2{0%{transform:translateX(110vw)}100%{transform:translateX(-200px)}}
/* hills */
.hill{position:absolute;bottom:0;background:var(--hill);border-radius:50% 50% 0 0;pointer-events:none;z-index:0}
.h1{width:400px;height:120px;left:-80px;bottom:0;background:var(--hill-dark)}
.h2{width:300px;height:90px;left:30%;bottom:0}
.h3{width:500px;height:140px;right:-100px;bottom:0;background:var(--hill-dark)}

/* layout */
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;padding:8px;gap:8px}
header.topbar{
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(#c9302c,#8b1a17);
  border:4px solid #000;border-radius:8px;padding:8px 14px;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.3), 0 4px 0 rgba(0,0,0,.4);
}
.title{font-size:18px;letter-spacing:1px;text-shadow:3px 3px 0 #000, 0 0 8px #ffcc33;display:flex;align-items:center;gap:10px}
.bounce{display:inline-block;animation:bounce 1.2s ease-in-out infinite}
.bounce.delay{animation-delay:.6s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button.btn{
  font-family:inherit;font-size:10px;color:#fff;background:#3aaa35;
  border:3px solid #000;border-radius:6px;padding:8px 10px;cursor:pointer;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35), 0 3px 0 rgba(0,0,0,.4);
  text-shadow:2px 2px 0 #000;
}
button.btn:hover{filter:brightness(1.1)}
button.btn:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.35), 0 1px 0 rgba(0,0,0,.4)}
button.btn.red{background:#e63946}
button.btn.blue{background:#1976d2}
button.btn.gold{background:#e0a800;color:#000;text-shadow:1px 1px 0 #fff}

main{display:flex;flex:1;gap:10px;min-height:0}
#leftCol{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:flex-start}
#centerCol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:0;position:relative}
#rightCol{flex:0 0 290px;display:flex;flex-direction:column;gap:8px;min-height:0}

/* HUD clocks */
.hud{
  background:#000;border:4px solid #fff;border-radius:6px;padding:10px 14px;
  font-family:'Press Start 2P',monospace;color:#fff;min-width:200px;text-align:center;
  box-shadow:0 4px 0 rgba(0,0,0,.5);
}
.hud .who{font-size:11px;color:#ffcc33;margin-bottom:6px;letter-spacing:1px}
.hud .time{font-size:22px;letter-spacing:2px}
.hud.active{outline:3px solid #ffcc33;animation:hudPulse 1s ease-in-out infinite}
.hud.low .time{color:#ff4d4d;animation:lowPulse 1s ease-in-out infinite}
@keyframes hudPulse{0%,100%{box-shadow:0 0 0 rgba(255,204,51,.6)}50%{box-shadow:0 0 18px rgba(255,204,51,.9)}}
@keyframes lowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.turn-banner{
  background:linear-gradient(#1976d2,#0d47a1);border:3px solid #000;border-radius:6px;
  padding:8px 12px;font-size:10px;text-align:center;width:220px;
  text-shadow:2px 2px 0 #000;
}
.turn-banner.black{background:linear-gradient(#6a1b9a,#3d0a5c)}

/* Board */
.board-wrap{
  position:relative;
  padding:30px;
  background:linear-gradient(180deg,#7ee06b,#3aaa35 30%,#1f6a1c);
  border:6px solid #000;border-radius:14px;
  box-shadow:inset 0 0 0 4px #1f6a1c, inset 0 0 0 8px #7ee06b, 0 8px 0 rgba(0,0,0,.4);
}
.board-wrap::before, .board-wrap::after{
  content:"";position:absolute;left:8px;right:8px;height:14px;
  background:linear-gradient(90deg, transparent 0, #7ee06b 5%, #3aaa35 50%, #1f6a1c 95%, transparent 100%);
  border-radius:8px;
}
.board-wrap::before{top:8px}
.board-wrap::after{bottom:8px}

.board{
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  width:min(72vh, 640px);height:min(72vh, 640px);
  border:4px solid #000;border-radius:4px;
  position:relative;
  background:#000;
}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;overflow:hidden}
.sq.light{background:
  radial-gradient(circle at 8% 8%, rgba(0,0,0,.18) 2px, transparent 3px),
  radial-gradient(circle at 92% 8%, rgba(0,0,0,.18) 2px, transparent 3px),
  radial-gradient(circle at 8% 92%, rgba(0,0,0,.18) 2px, transparent 3px),
  radial-gradient(circle at 92% 92%, rgba(0,0,0,.18) 2px, transparent 3px),
  linear-gradient(135deg, #fde288, #f7d774 60%, #d9b14a);
}
.sq.dark{background:
  repeating-linear-gradient(0deg, rgba(0,0,0,.15) 0 2px, transparent 2px 12px),
  repeating-linear-gradient(90deg, rgba(0,0,0,.15) 0 2px, transparent 2px 24px),
  linear-gradient(135deg,#b5651d,#8b4513 60%,#5b2c0c);
}
.sq.last{box-shadow: inset 0 0 0 3px rgba(255,235,80,.85)}
.sq.selected{box-shadow: inset 0 0 0 4px #ffd60a; animation:starPulse .8s ease-in-out infinite}
.sq.cursor{outline:3px dashed #00e5ff;outline-offset:-3px;z-index:2}
.sq.check{animation:checkPulse .7s ease-in-out infinite}
@keyframes starPulse{0%,100%{box-shadow:inset 0 0 0 4px #ffd60a, 0 0 8px #ffea00}50%{box-shadow:inset 0 0 0 4px #fff48a, 0 0 18px #ffea00}}
@keyframes checkPulse{0%,100%{box-shadow:inset 0 0 0 4px rgba(230,57,70,.7)}50%{box-shadow:inset 0 0 0 6px rgba(255,80,80,1)}}
.dot{position:absolute;width:24%;height:24%;border-radius:50%;background:radial-gradient(circle, #7ee06b, #1f6a1c);box-shadow:0 0 6px rgba(0,0,0,.5);pointer-events:none}
.cap-ring{position:absolute;inset:6%;border:4px solid #ff3838;border-radius:50%;box-shadow:0 0 8px #ff3838;pointer-events:none}

.piece{
  width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:calc(min(72vh,640px)/14);
  font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji', sans-serif;
  position:relative;z-index:1;
  transition:transform .12s;
}
.piece.w{background:radial-gradient(circle at 35% 30%, #fff7d6, #fde9a8 60%, #d9b14a);box-shadow:inset 0 0 0 3px #ffcc33, 0 2px 4px rgba(0,0,0,.4)}
.piece.b{background:radial-gradient(circle at 35% 30%, #6a3aa1, #3a1a6b 60%, #1a0a3a);box-shadow:inset 0 0 0 3px #e63946, 0 2px 6px rgba(0,0,0,.6), 0 0 8px rgba(106,58,161,.7);color:#fff}
.sq:hover .piece{transform:scale(1.05)}

/* Coordinates */
.coords-files, .coords-ranks{position:absolute;font-size:10px;color:#fff;text-shadow:1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000}
.coords-files{display:grid;grid-template-columns:repeat(8,1fr);left:30px;right:30px;text-align:center}
.coords-files.top{top:12px}
.coords-files.bottom{bottom:12px}
.coords-ranks{display:grid;grid-template-rows:repeat(8,1fr);top:30px;bottom:30px;align-items:center;justify-items:center}
.coords-ranks.left{left:12px}
.coords-ranks.right{right:12px}

/* right panel */
.panel{
  background:rgba(0,0,0,.78);border:3px solid #fff;border-radius:8px;padding:10px;
  font-family:'Press Start 2P',monospace;font-size:9px;color:#fff;
}
.panel h3{margin:0 0 8px 0;font-size:10px;color:#ffcc33;letter-spacing:1px}
.status{font-size:10px;min-height:18px;color:#9be37a;text-shadow:1px 1px 0 #000}
.status.warn{color:#ff5050}
.status.win{color:#ffd60a}
.controls-row{display:flex;flex-direction:column;gap:6px}
.tc-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tc-row label{font-size:8px;color:#fff;min-width:60px}
select.mario-sel{
  font-family:inherit;font-size:9px;background:#fff;color:#000;border:2px solid #000;border-radius:4px;padding:4px 6px;cursor:pointer;
}

#moves{
  background:#111;border:2px solid #555;border-radius:4px;padding:6px;
  font-size:9px;line-height:1.7;height:170px;overflow-y:auto;
  color:#fff;
}
#moves .mv{display:inline-block;margin-right:6px}
#moves .mvnum{color:#ffcc33;margin-right:4px}
#moves::-webkit-scrollbar{width:8px}
#moves::-webkit-scrollbar-thumb{background:#666;border-radius:4px}

.captured-row{min-height:28px;font-size:18px;display:flex;flex-wrap:wrap;gap:2px;background:#222;padding:4px;border-radius:4px;border:1px solid #444}
.captured-row .pc{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-size:14px}
.captured-row .pc.w{background:#fde9a8;box-shadow:inset 0 0 0 1px #ffcc33}
.captured-row .pc.b{background:#3a1a6b;box-shadow:inset 0 0 0 1px #e63946;color:#fff}

/* paused overlay */
#pausedOv, #promoOv, #gameOv{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);z-index:50;border-radius:14px;
}
#pausedOv.show, #promoOv.show, #gameOv.show{display:flex}
.pausedBox, .promoBox, .gameBox{
  background:linear-gradient(#222,#000);border:4px solid #ffcc33;border-radius:10px;
  padding:20px 26px;text-align:center;font-size:14px;color:#fff;text-shadow:2px 2px 0 #000;
  box-shadow:0 0 30px rgba(255,204,51,.6);
}
.promoBox .picks{display:flex;gap:10px;margin-top:14px;justify-content:center}
.promoBtn{
  font-family:inherit;width:70px;height:70px;border-radius:50%;font-size:30px;cursor:pointer;
  background:radial-gradient(circle at 35% 30%, #fff7d6, #fde9a8 60%, #d9b14a);
  border:3px solid #000;box-shadow:inset 0 0 0 3px #ffcc33;
}
.promoBtn.b{background:radial-gradient(circle at 35% 30%, #6a3aa1, #3a1a6b 60%, #1a0a3a);box-shadow:inset 0 0 0 3px #e63946;color:#fff}
.gameBox h2{margin:0 0 10px 0;font-size:18px;color:#ffcc33}
.gameBox p{margin:8px 0 14px 0;font-size:11px;line-height:1.6}

/* coin shower */
.coin{position:absolute;font-size:20px;animation:fall linear forwards;pointer-events:none;z-index:60}
@keyframes fall{
  0%{transform:translateY(-40px) rotate(0deg);opacity:1}
  100%{transform:translateY(120vh) rotate(720deg);opacity:.3}
}

@media(max-width:1100px){
  #rightCol{flex-basis:240px}
  .title{font-size:14px}
}
@media(max-width:900px){
  main{flex-direction:column;align-items:center}
  #rightCol{flex:0 0 auto;width:100%;max-width:640px}
  #leftCol{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .board{width:min(86vw, 560px);height:min(86vw, 560px)}
}
</style>
  <script type="application/ld+json">
{
  "@context": "urn:goose.ai:schema",
  "@type": "GooseApp",
  "name": "mario-chess",
  "description": "A fully playable two-player Mario-themed chess game with chess clock, full rules, and retro HUD styling.",
  "width": 1280,
  "height": 900,
  "resizable": true,
  "mcpServers": [
    "apps"
  ]
}
  </script>
  <script type="application/x-goose-prd">
Build a Mario-themed chess game called "Mario Chess" — a fully playable two-player (hot-seat) chess game on a single device with a chess clock. Use HTML/CSS/JavaScript only (no external dependencies; everything self-contained).

VISUAL THEME (Mario / Super Mario Bros):
- Background: bright blue sky with stylized white clouds and rolling green hills (CSS gradients + SVG/CSS shapes, no external images).
- Title bar at top: "🍄 Mario Chess 🏰" in a chunky, bold, blocky font (e.g., "Press Start 2P" via Google Fonts is OK, OR fallback to system bold sans). Include small bouncing coin/mushroom emoji decorations.
- Board: 8x8, styled like Mario world tiles. Light squares = warm tan/sand "?-block" yellow (#f7d774-ish) with subtle rivet dots in corners; dark squares = brick red-brown (#b5651d / #8b4513) with brick-pattern lines. Add a thick green pipe-style border around the board with highlights/shadows.
- Coordinate labels (a–h, 1–8) outside the board in white with a dark outline.
- Pieces represented as emoji/text characters in a circular badge so they read clearly:
  - White (Mushroom Kingdom heroes): 
    - King = 🤴 (Mario as king) — fallback "M"
    - Queen = 👸 (Princess Peach)
    - Rook = 🏰 (Castle/Toad fortress)
    - Bishop = 🍄 (Toad/Mushroom)
    - Knight = 🦖 (Yoshi)
    - Pawn = 🪙 (Coin / Goomba-stomper) — actually use 🟡 small Goomba? Use 🍄 small? Pick: pawns = small "🟫" Goomba look. Use emoji 👶 no — use 🟤 with face. Simplest: pawn white = "🪙" coin.
  - Black (Bowser's army):
    - King = 🐢 (Bowser) — fallback "B"
    - Queen = 🧙‍♀️ or 👹 (Wendy / Kamek) — use 🧙
    - Rook = 🏯 (Bowser's castle)
    - Bishop = 👻 (Boo)
    - Knight = 🦎 (Koopa) or 🐉
    - Pawn = 👾 (Goomba-ish) or 🟫
  Pick a consistent legible emoji for each. White pieces sit on a light cream circle, black pieces on a dark purple circle with a subtle glow so both are clearly distinguishable regardless of square color. Add a thin colored ring: gold for white, red for black.
- Selected square: glowing yellow outline (star power vibe) with subtle pulse animation.
- Legal move squares: small green pipe dot in center; capture squares: red ring around the target piece.
- Last move: highlight from-square and to-square with a soft yellow tint.
- Check: the king's square pulses red.

GAMEPLAY (FULL CHESS RULES — must be correct):
- Standard 8x8 starting position.
- Click/tap a piece to select; legal destinations are highlighted. Click a destination to move. Click another own piece to switch selection. Click empty/illegal square to deselect.
- Implement all standard rules:
  - Pawn: single & double first move, diagonal capture, en passant, promotion (show a Mario-themed picker: Queen/Rook/Bishop/Knight using the themed icons; default Queen on quick-confirm).
  - Knight L-moves, Bishop diagonals, Rook ranks/files, Queen both, King one square.
  - Castling kingside & queenside with all standard conditions (king & rook unmoved, no pieces between, king not in/through/into check).
  - Check detection; you cannot make a move that leaves your own king in check.
  - Checkmate and stalemate detection.
  - Draw by insufficient material (K vs K, K+B vs K, K+N vs K, K+B vs K+B same color bishops).
  - Threefold repetition draw (track position hashes including side-to-move, castling rights, en passant target).
  - 50-move rule draw (claimable automatically when reached).
- Move list / notation panel on the side showing moves in algebraic notation (e.g., "1. e4 e5  2. Nf3 Nc6"). Auto-scroll to latest. Use SAN with check (+) and mate (#) annotations.
- Captured pieces display: show captured white pieces on Black's side and vice versa, grouped/sorted by value.
- Turn indicator: a banner showing "Mario's Turn" (white) or "Bowser's Turn" (black) with that side's avatar; current player's clock highlighted/animated.

CHESS CLOCK:
- Time control selector before/at start: 5 min, 10 min, 15 min, 30 min (default 10). Optional increment selector: 0s, 2s, 5s (default 0).
- Two large countdown displays styled like retro Mario HUD score boxes ("MARIO  10:00" / "BOWSER 10:00") in monospace digits. The active side ticks down each 100ms; when below 30s it turns red and pulses, plays a subtle tick (Web Audio API beep, optional & mute toggle).
- Clock starts on White's first move (not before). Switching turns adds increment if configured.
- If a clock hits 0:00 → game ends "Time out — <Other> wins!" unless the opponent has insufficient material to mate, in which case it's a draw.
- Pause/Resume button. Hotkey: Spacebar toggles pause. While paused, the board is not interactable (overlay "PAUSED — press Space or click Resume").

CONTROLS / UI:
- Top bar: title, mute toggle (🔊/🔇), pause/resume, new game (with confirm if game in progress), undo last move (full undo of half-move including clock state — limited to last 1 ply for simplicity, or unlimited stack — implement unlimited stack of history).
- Side panel: time control selector, increment selector, current status text (e.g., "Check!", "Checkmate — Mario wins!", "Stalemate — Draw"), move list, captured pieces.
- Game-over modal with confetti-like coin shower animation, result text, and "Play Again" button.
- Responsive: works on desktop (board ~min 480px) and reasonably on tablet/phone (board scales, controls stack).
- Keyboard: arrow keys move a cursor highlight; Enter selects/moves; Esc deselects; Space pauses; U undoes.

SOUND (Web Audio API, all synthesized — no external files):
- Move: short blip.
- Capture: lower thunk.
- Check: warning chord.
- Checkmate: descending tune.
- Promotion: power-up rising arpeggio (1-up style, short).
- Castle: double-blip.
- Time low (<30s): subtle tick each second.
- Mute toggle persists in memory for the session.

CODE QUALITY:
- Single self-contained HTML file. Clean, organized JavaScript with a Game state object (board, sideToMove, castlingRights, enPassant, halfmoveClock, fullmoveNumber, history). Implement move generation per piece, then filter for legality (no leaving own king in check). Make it robust — chess rules must actually be correct.
- Use requestAnimationFrame for clock animations smoothness, but compute time using Date.now() deltas to avoid drift.
- No external network requests at runtime (Google Font import is OK if available, but include a graceful fallback font stack).

Make it fun, polished, clearly Mario-flavored, and most importantly: a real, correct, playable chess game with a working clock.
  </script>
</head>
<body>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>
<div class="hill h1"></div>
<div class="hill h2"></div>
<div class="hill h3"></div>

<div id="app">
  <header class="topbar">
    <div class="title">
      <span class="bounce">🍄</span>
      Mario Chess
      <span class="bounce delay">🏰</span>
    </div>
    <div class="btns">
      <button class="btn gold" id="btnMute" title="Mute">🔊</button>
      <button class="btn blue" id="btnPause" title="Pause (Space)">⏸ Pause</button>
      <button class="btn" id="btnUndo" title="Undo (U)">⤺ Undo</button>
      <button class="btn red" id="btnNew" title="New Game">★ New Game</button>
    </div>
  </header>

  <main>
    <div id="leftCol">
      <div class="hud" id="hudBlack">
        <div class="who">🐢 BOWSER</div>
        <div class="time" id="timeBlack">10:00</div>
      </div>
      <div class="turn-banner" id="turnBanner">🤴 Mario's Turn</div>
      <div class="hud" id="hudWhite">
        <div class="who">🤴 MARIO</div>
        <div class="time" id="timeWhite">10:00</div>
      </div>
    </div>

    <div id="centerCol">
      <div class="board-wrap" id="boardWrap">
        <div class="coords-files top" id="filesTop"></div>
        <div class="coords-files bottom" id="filesBot"></div>
        <div class="coords-ranks left" id="ranksL"></div>
        <div class="coords-ranks right" id="ranksR"></div>
        <div class="board" id="board"></div>

        <div id="pausedOv">
          <div class="pausedBox">
            ⏸ PAUSED<br><br>
            <span style="font-size:10px;color:#ffcc33">Press Space or click Resume</span>
          </div>
        </div>
        <div id="promoOv">
          <div class="promoBox">
            Choose Promotion!
            <div class="picks" id="promoPicks"></div>
          </div>
        </div>
        <div id="gameOv">
          <div class="gameBox">
            <h2 id="goTitle">Game Over</h2>
            <p id="goText"></p>
            <button class="btn gold" id="goPlayAgain">★ Play Again</button>
          </div>
        </div>
      </div>
    </div>

    <div id="rightCol">

<script>
/* =========================================================
   Mario Chess - full chess engine + clock
   ========================================================= */

// Piece icons
const ICON = {
  w: { K:'🤴', Q:'👸', R:'🏰', B:'🍄', N:'🦖', P:'🪙' },
  b: { K:'🐢', Q:'🧙', R:'🏯', B:'👻', N:'🐉', P:'👾' }
};
const VALUE = { P:1, N:3, B:3, R:5, Q:9, K:0 };
const FILES = ['a','b','c','d','e','f','g','h'];

// ---------- Game State ----------
function createInitialState(){
  // board: 8x8 array, rank 0 = rank 1 (white back rank), rank 7 = rank 8.
  // files: 0=a..7=h
  // piece: {c:'w'|'b', t:'K'|'Q'|'R'|'B'|'N'|'P'} or null
  const b = Array.from({length:8},()=>Array(8).fill(null));
  const back = ['R','N','B','Q','K','B','N','R'];
  for (let f=0;f<8;f++){
    b[0][f] = {c:'w', t:back[f]};
    b[1][f] = {c:'w', t:'P'};
    b[6][f] = {c:'b', t:'P'};
    b[7][f] = {c:'b', t:back[f]};
  }
  return {
    board: b,
    side: 'w',
    castling: { wK:true, wQ:true, bK:true, bQ:true },
    ep: null, // {r,f} square that can be captured to (en passant target square, behind the pawn)
    halfmove: 0, // for 50 move rule
    fullmove: 1,
    history: [], // list of move records
    posCounts: {}, // for threefold
    result: null, // null or {type, winner, reason}
  };
}

let G = createInitialState();
hashAndCount(G);

function clonePiece(p){ return p ? {c:p.c, t:p.t} : null; }
function copyBoard(b){ return b.map(row=>row.map(clonePiece)); }
function inBounds(r,f){ return r>=0 && r<8 && f>=0 && f<8; }

function findKing(board, color){
  for (let r=0;r<8;r++) for (let f=0;f<8;f++){
    const p=board[r][f]; if (p && p.c===color && p.t==='K') return {r,f};
  }
  return null;
}

// Is square (r,f) attacked by `byColor`?
function isAttacked(board, r, f, byColor){
  // pawn attacks
  const pd = byColor==='w' ? -1 : 1; // attacking pawn is at r+pd from target (since white pawns move +1 and attack +1 forward diagonals)
  // White pawns attack squares at r+1, f+/-1; so a square (r,f) is attacked by white pawn if there's a white pawn at (r-1, f-1) or (r-1, f+1)
  const prr = byColor==='w' ? r-1 : r+1;
  for (const df of [-1,1]){
    const nf = f+df;
    if (inBounds(prr, nf)){
      const p = board[prr][nf];
      if (p && p.c===byColor && p.t==='P') return true;
    }
  }
  // knight
  const knOff = [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
  for (const [dr,df] of knOff){
    const nr=r+dr, nf=f+df;
    if (inBounds(nr,nf)){
      const p=board[nr][nf];
      if (p && p.c===byColor && p.t==='N') return true;
    }
  }
  // king
  for (let dr=-1; dr<=1; dr++) for (let df=-1; df<=1; df++){
    if (!dr && !df) continue;
    const nr=r+dr, nf=f+df;
    if (inBounds(nr,nf)){
      const p=board[nr][nf];
      if (p && p.c===byColor && p.t==='K') return true;
    }
  }
  // sliding: bishop/queen (diagonals), rook/queen (orth)
  const diag=[[1,1],[1,-1],[-1,1],[-1,-1]];
  for (const [dr,df] of diag){
    let nr=r+dr, nf=f+df;
    while (inBounds(nr,nf)){
      const p=board[nr][nf];
      if (p){
        if (p.c===byColor && (p.t==='B' || p.t==='Q')) return true;
        break;
      }
      nr+=dr; nf+=df;
    }
  }
  const orth=[[1,0],[-1,0],[0,1],[0,-1]];
  for (const [dr,df] of orth){
    let nr=r+dr, nf=f+df;
    while (inBounds(nr,nf)){
      const p=board[nr][nf];
      if (p){
        if (p.c===byColor && (p.t==='R' || p.t==='Q')) return true;
        break;
      }
      nr+=dr; nf+=df;
    }
  }
  return false;
}

function inCheck(state, color){
  const k = findKing(state.board, color);
  if (!k) return false;
  return isAttacked(state.board, k.r, k.f, color==='w'?'b':'w');
}

// Generate pseudo-legal moves for piece at (r,f)
function genPieceMoves(state, r, f){
  const piece = state.board[r][f];
  if (!piece) return [];
  const moves = [];
  const c = piece.c;
  const enemy = c==='w'?'b':'w';
  const b = state.board;

  function pushIfEnemyOrEmpty(nr,nf,extra){
    if (!inBounds(nr,nf)) return false;
    const target = b[nr][nf];
    if (!target){
      moves.push(Object.assign({from:{r,f},to:{r:nr,f:nf},capture:false},extra||{}));
      return true; // can continue sliding
    } else if (target.c === enemy){
      moves.push(Object.assign({from:{r,f},to:{r:nr,f:nf},capture:true,captured:{...target}},extra||{}));
      return false;
    }
    return false;
  }

  if (piece.t === 'P'){
    const dir = c==='w'?1:-1;
    const startRank = c==='w'?1:6;
    const promoRank = c==='w'?7:0;
    // forward
    if (inBounds(r+dir,f) && !b[r+dir][f]){
      if (r+dir === promoRank){
        for (const promo of ['Q','R','B','N']){
          moves.push({from:{r,f},to:{r:r+dir,f},capture:false,promotion:promo});
        }
      } else {
        moves.push({from:{r,f},to:{r:r+dir,f},capture:false});
        // double
        if (r === startRank && !b[r+2*dir][f]){
          moves.push({from:{r,f},to:{r:r+2*dir,f},capture:false,double:true});
        }
      }
    }
    // captures
    for (const df of [-1,1]){
      const nr = r+dir, nf = f+df;
      if (!inBounds(nr,nf)) continue;
      const t = b[nr][nf];
      if (t && t.c===enemy){
        if (nr === promoRank){
          for (const promo of ['Q','R','B','N']){
            moves.push({from:{r,f},to:{r:nr,f:nf},capture:true,captured:{...t},promotion:promo});
          }
        } else {
          moves.push({from:{r,f},to:{r:nr,f:nf},capture:true,captured:{...t}});
        }
      } else if (state.ep && state.ep.r===nr && state.ep.f===nf){
        // en passant
        const capR = r; // captured pawn is on same rank as our pawn
        const capPiece = b[capR][nf];
        if (capPiece && capPiece.c===enemy && capPiece.t==='P'){
          moves.push({from:{r,f},to:{r:nr,f:nf},capture:true,captured:{...capPiece},enPassant:true,captureSquare:{r:capR,f:nf}});
        }
      }
    }
  }
  else if (piece.t === 'N'){
    const offs=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
    for (const [dr,df] of offs) pushIfEnemyOrEmpty(r+dr,f+df);
  }
  else if (piece.t === 'B' || piece.t==='R' || piece.t==='Q'){
    const dirs=[];
    if (piece.t!=='R'){ dirs.push([1,1],[1,-1],[-1,1],[-1,-1]); }
    if (piece.t!=='B'){ dirs.push([1,0],[-1,0],[0,1],[0,-1]); }
    for (const [dr,df] of dirs){
      let nr=r+dr, nf=f+df;
      while (inBounds(nr,nf)){
        const cont = pushIfEnemyOrEmpty(nr,nf);
        if (!cont) break;
        nr+=dr; nf+=df;
      }
    }
  }
  else if (piece.t === 'K'){
    for (let dr=-1;dr<=1;dr++) for (let df=-1;df<=1;df++){
      if (!dr && !df) continue;
      pushIfEnemyOrEmpty(r+dr,f+df);
    }
    // castling
    const rights = state.castling;
    const homeR = c==='w'?0:7;
    if (r===homeR && f===4){
      // kingside
      const kRight = c==='w' ? rights.wK : rights.bK;
      if (kRight){
        if (!b[homeR][5] && !b[homeR][6]){
          const rk = b[homeR][7];
          if (rk && rk.c===c && rk.t==='R'){
            // king must not be in check, pass through, or land in check
            if (!isAttacked(b, homeR, 4, enemy) &&
                !isAttacked(b, homeR, 5, enemy) &&
                !isAttacked(b, homeR, 6, enemy)){
              moves.push({from:{r,f},to:{r:homeR,f:6},capture:false,castle:'K'});
            }
          }
        }
      }
      const qRight = c==='w' ? rights.wQ : rights.bQ;
      if (qRight){
        if (!b[homeR][1] && !b[homeR][2] && !b[homeR][3]){
          const rk = b[homeR][0];
          if (rk && rk.c===c && rk.t==='R'){
            if (!isAttacked(b, homeR, 4, enemy) &&
                !isAttacked(b, homeR, 3, enemy) &&
                !isAttacked(b, homeR, 2, enemy)){
              moves.push({from:{r,f},to:{r:homeR,f:2},capture:false,castle:'Q'});
            }
          }
        }
      }
    }
  }
  return moves;
}

// All pseudo-legal moves for side
function allPseudoMoves(state, color){
  const out=[];
  for (let r=0;r<8;r++) for (let f=0;f<8;f++){
    const p = state.board[r][f];
    if (p && p.c===color){
      const ms = genPieceMoves(state, r, f);
      for (const m of ms) out.push(m);
    }
  }
  return out;
}

// Apply a move IN PLACE; returns an "undo" record
function applyMove(state, m){
  const undo = {
    move: m,
    captured: null,
    capturedAt: null, // for ep
    prevCastling: {...state.castling},
    prevEp: state.ep ? {...state.ep} : null,
    prevHalf: state.halfmove,
    prevFull: state.fullmove,
    prevSide: state.side,
    rookMove: null, // for castling
    promotedFromT: null,
  };
  const b = state.board;
  const piece = b[m.from.r][m.from.f];
  // capture
  if (m.enPassant){
    undo.captured = b[m.captureSquare.r][m.captureSquare.f];
    undo.capturedAt = {r:m.captureSquare.r, f:m.captureSquare.f};
    b[m.captureSquare.r][m.captureSquare.f] = null;
  } else if (b[m.to.r][m.to.f]){
    undo.captured = b[m.to.r][m.to.f];
    undo.capturedAt = {r:m.to.r, f:m.to.f};
  }
  // move piece
  b[m.to.r][m.to.f] = piece;
  b[m.from.r][m.from.f] = null;
  // promotion
  if (m.promotion){
    undo.promotedFromT = piece.t;
    piece.t = m.promotion;
  }
  // castling rook move
  if (m.castle){
    const homeR = piece.c==='w'?0:7;
    if (m.castle==='K'){
      const rk = b[homeR][7];
      b[homeR][5] = rk;
      b[homeR][7] = null;
      undo.rookMove = {from:{r:homeR,f:7}, to:{r:homeR,f:5}};
    } else {
      const rk = b[homeR][0];
      b[homeR][3] = rk;
      b[homeR][0] = null;
      undo.rookMove = {from:{r:homeR,f:0}, to:{r:homeR,f:3}};
    }
  }
  // update castling rights
  // king moves -> lose both
  if (piece.t==='K'){
    if (piece.c==='w'){ state.castling.wK=false; state.castling.wQ=false; }
    else { state.castling.bK=false; state.castling.bQ=false; }
  }
  // rook moves from corners
  if (piece.t==='R'){
    if (piece.c==='w' && m.from.r===0 && m.from.f===0) state.castling.wQ=false;
    if (piece.c==='w' && m.from.r===0 && m.from.f===7) state.castling.wK=false;
    if (piece.c==='b' && m.from.r===7 && m.from.f===0) state.castling.bQ=false;
    if (piece.c==='b' && m.from.r===7 && m.from.f===7) state.castling.bK=false;
  }
  // capturing rook on its home square
  if (undo.captured && undo.captured.t==='R'){
    if (m.to.r===0 && m.to.f===0) state.castling.wQ=false;
    if (m.to.r===0 && m.to.f===7) state.castling.wK=false;
    if (m.to.r===7 && m.to.f===0) state.castling.bQ=false;
    if (m.to.r===7 && m.to.f===7) state.castling.bK=false;
  }
  // ep target
  if (piece.t==='P' && m.double){
    state.ep = { r: (m.from.r + m.to.r)/2, f: m.from.f };
  } else {
    state.ep = null;
  }
  // halfmove
  if (piece.t==='P' || undo.captured) state.halfmove = 0;
  else state.halfmove++;
  // fullmove
  if (state.side==='b') state.fullmove++;
  // toggle side
  state.side = state.side==='w'?'b':'w';
  return undo;
}

function undoMove(state, undo){
  const m = undo.move;
  state.side = undo.prevSide;
  state.castling = undo.prevCastling;
  state.ep = undo.prevEp;
  state.halfmove = undo.prevHalf;
  state.fullmove = undo.prevFull;
  const b = state.board;
  const piece = b[m.to.r][m.to.f];
  // unpromote
  if (m.promotion && undo.promotedFromT){
    piece.t = undo.promotedFromT;
  }
  b[m.from.r][m.from.f] = piece;
  b[m.to.r][m.to.f] = null;
  if (undo.captured && undo.capturedAt){
    b[undo.capturedAt.r][undo.capturedAt.f] = undo.captured;
  }
  if (undo.rookMove){
    const rk = b[undo.rookMove.to.r][undo.rookMove.to.f];
    b[undo.rookMove.from.r][undo.rookMove.from.f] = rk;
    b[undo.rookMove.to.r][undo.rookMove.to.f] = null;
  }
}

// Legal moves: filter pseudo-legal that don't leave own king in check
function legalMovesFor(state, r, f){
  const piece = state.board[r][f];
  if (!piece || piece.c !== state.side) return [];
  const ps = genPieceMoves(state, r, f);
  const out = [];
  for (const m of ps){
    const u = applyMove(state, m);
    const stillCheck = inCheck(state, u.prevSide); // mover's color
    undoMove(state, u);
    if (!stillCheck) out.push(m);
  }
  return out;
}

function allLegalMoves(state){
  const out=[];
  for (let r=0;r<8;r++) for (let f=0;f<8;f++){
    const p = state.board[r][f];
    if (p && p.c === state.side){
      const ms = legalMovesFor(state, r, f);
      for (const m of ms) out.push(m);
    }
  }
  return out;
}

// ----- Insufficient material -----
function insufficientMaterial(state){
  // collect non-king pieces by color
  const pieces = { w:[], b:[] };
  for (let r=0;r<8;r++) for (let f=0;f<8;f++){
    const p = state.board[r][f];
    if (p && p.t!=='K') pieces[p.c].push({...p, r, f});
  }
  // K vs K
  if (pieces.w.length===0 && pieces.b.length===0) return true;
  // K + minor vs K
  if (pieces.w.length===0 && pieces.b.length===1){
    const p = pieces.b[0]; if (p.t==='B'||p.t==='N') return true;
  }
  if (pieces.b.length===0 && pieces.w.length===1){
    const p = pieces.w[0]; if (p.t==='B'||p.t==='N') return true;
  }
  // K+B vs K+B same colored bishops
  if (pieces.w.length===1 && pieces.b.length===1 && pieces.w[0].t==='B' && pieces.b[0].t==='B'){
    const cw = (pieces.w[0].r + pieces.w[0].f) % 2;
    const cb = (pieces.b[0].r + pieces.b[0].f) % 2;
    if (cw === cb) return true;
  }
  return false;
}

// Insufficient material to mate (for time-out draw): the SIDE color cannot mate alone (regardless of opponent)
function cannotMate(state, color){
  let bishops=0, knights=0, others=0;
  for (let r=0;r<8;r++) for (let f=0;f<8;f++){
    const p = state.board[r][f];
    if (p && p.c===color && p.t!=='K'){
      if (p.t==='B') bishops++;
      else if (p.t==='N') knights++;
      else others++;
    }
  }
  if (others>0) return false;
  // lone king or K + single minor cannot mate
  if (bishops + knights <= 1) return true;
  return false;
}

// ----- Position hash for repetition -----
function positionHash(state){
  let s='';
  for (let r=0;r<8;r++) for (let f=0;f<8;f++){
    const p = state.board[r][f];
    s += p ? (p.c + p.t) : '..';
  }
  s += '|' + state.side;
  s += '|' + (state.castling.wK?'K':'') + (state.castling.wQ?'Q':'') + (state.castling.bK?'k':'') + (state.castling.bQ?'q':'');
  s += '|' + (state.ep ? state.ep.r+','+state.ep.f : '-');
  return s;
}
function hashAndCount(state){
  const h = positionHash(state);
  state.posCounts[h] = (state.posCounts[h]||0)+1;
  return h;
}

// ----- SAN -----
function moveToSAN(state, move, beforeBoard, beforeState){
  // Castling
  if (move.castle){
    let san = move.castle==='K' ? 'O-O' : 'O-O-O';
    return san;
  }
  const piece = beforeBoard[move.from.r][move.from.f];
  let san='';
  if (piece.t==='P'){
    if (move.capture){
      san = FILES[move.from.f] + 'x' + FILES[move.to.f] + (move.to.r+1);
    } else {
      san = FILES[move.to.f] + (move.to.r+1);
    }
    if (move.promotion) san += '=' + move.promotion;
  } else {
    san = piece.t;
    // disambiguation: find other pieces of same type that can also move to to-square
    const ambig=[];
    for (let r=0;r<8;r++) for (let f=0;f<8;f++){
      if (r===move.from.r && f===move.from.f) continue;
      const p = beforeBoard[r][f];
      if (p && p.c===piece.c && p.t===piece.t){
        // generate moves from (r,f) in beforeState
        const ms = genPieceMoves(beforeState, r, f);
        for (const mm of ms){
          if (mm.to.r===move.to.r && mm.to.f===move.to.f){
            // check legality
            const u = applyMove(beforeState, mm);
            const stillCheck = inCheck(beforeState, u.prevSide);
            undoMove(beforeState, u);
            if (!stillCheck) ambig.push({r,f});
            break;
          }
        }
      }
    }
    if (ambig.length){
      const sameFile = ambig.some(a=>a.f===move.from.f);
      const sameRank = ambig.some(a=>a.r===move.from.r);
      if (!sameFile) san += FILES[move.from.f];
      else if (!sameRank) san += (move.from.r+1);
      else san += FILES[move.from.f] + (move.from.r+1);
    }
    if (move.capture) san += 'x';
    san += FILES[move.to.f] + (move.to.r+1);
  }
  return san;
}

// =========================================================
// AUDIO
// =========================================================
let audioCtx = null;
let muted = false;
function ensureAudio(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ audioCtx=null; }
  }
  return audioCtx;
}
function beep(freq, dur=0.08, type='square', vol=0.12, when=0){
  if (muted) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = 0;
  o.connect(g); g.connect(ctx.destination);
  const t = ctx.currentTime + when;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.start(t); o.stop(t+dur+0.02);
}
const Snd = {
  move(){ beep(660, 0.06, 'square', 0.1); },
  capture(){ beep(180, 0.12, 'sawtooth', 0.18); beep(120, 0.16, 'sawtooth', 0.15, 0.04); },
  check(){ beep(440,0.1,'square',0.15); beep(550,0.1,'square',0.15,0.05); beep(330,0.18,'square',0.15,0.1); },
  mate(){ const seq=[660,520,440,330,220]; seq.forEach((f,i)=>beep(f,0.18,'square',0.2,i*0.13)); },
  promo(){ const seq=[523,659,784,1047,1319]; seq.forEach((f,i)=>beep(f,0.09,'square',0.15,i*0.06)); },
  castle(){ beep(700,0.07,'square',0.12); beep(900,0.07,'square',0.12,0.08); },
  tick(){ beep(1200,0.04,'square',0.08); }
};

// =========================================================
// UI / Rendering
// =========================================================
const boardEl = document.getElementById('board');
const filesTop = document.getElementById('filesTop');
const filesBot = document.getElementById('filesBot');
const ranksL = document.getElementById('ranksL');
const ranksR = document.getElementById('ranksR');
const movesEl = document.getElementById('moves');
const statusEl = document.getElementById('statusText');
const turnBanner = document.getElementById('turnBanner');
const hudW = document.getElementById('hudWhite');
const hudB = document.getElementById('hudBlack');
const timeWEl = document.getElementById('timeWhite');
const timeBEl = document.getElementById('timeBlack');
const capByWhite = document.getElementById('capByWhite');
const capByBlack = document.getElementById('capByBlack');
const pausedOv = document.getElementById('pausedOv');
const promoOv = document.getElementById('promoOv');
const promoPicks = document.getElementById('promoPicks');
const gameOv = document.getElementById('gameOv');
const goTitle = document.getElementById('goTitle');
const goText = document.getElementById('goText');

// build coords
function buildCoords(){
  filesTop.innerHTML=''; filesBot.innerHTML=''; ranksL.innerHTML=''; ranksR.innerHTML='';
  for (let f=0;f<8;f++){
    const fl = FILES[f];
    const a = document.createElement('div'); a.textContent = fl; filesTop.appendChild(a);
    const b = document.createElement('div'); b.textContent = fl; filesBot.appendChild(b);
  }
  for (let r=7;r>=0;r--){
    const a = document.createElement('div'); a.textContent = (r+1); ranksL.appendChild(a);
    const b = document.createElement('div'); b.textContent = (r+1); ranksR.appendChild(b);
  }
}
buildCoords();

// build board squares (8 rows top to bottom, top is rank 8)
const squares = [];
function buildBoard(){
  boardEl.innerHTML='';
  squares.length=0;
  for (let displayRow=0; displayRow<8; displayRow++){
    // displayRow 0 = rank 8 = state row 7
    const r = 7 - displayRow;
    for (let f=0; f<8; f++){
      const sq = document.createElement('div');
      sq.className = 'sq ' + (((r+f)%2===0) ? 'dark' : 'light');
      sq.dataset.r = r; sq.dataset.f = f;
      sq.addEventListener('click', ()=>onSquareClick(r,f));
      boardEl.appendChild(sq);
      squares.push({el:sq, r, f});
    }
  }
}
buildBoard();

let selected = null; // {r,f}
let legalForSelected = [];
let cursor = {r:1, f:4}; // keyboard cursor
let lastMove = null;

function squareEl(r,f){
  // since squares are in display order, find by data
  for (const s of squares) if (s.r===r && s.f===f) return s.el;
  return null;
}

function render(){
  for (const s of squares){
    const el = s.el;
    el.innerHTML='';
    el.classList.remove('selected','last','check','cursor');
    const piece = G.board[s.r][s.f];
    if (piece){
      const pe = document.createElement('div');
      pe.className = 'piece ' + piece.c;
      pe.textContent = ICON[piece.c][piece.t];
      el.appendChild(pe);
    }
  }
  // last move highlight
  if (lastMove){
    const a = squareEl(lastMove.from.r, lastMove.from.f);
    const b = squareEl(lastMove.to.r, lastMove.to.f);
    if (a) a.classList.add('last');
    if (b) b.classList.add('last');
  }
  // check highlight
  if (G.result==null){
    if (inCheck(G, G.side)){
      const k = findKing(G.board, G.side);
      if (k){
        const ke = squareEl(k.r, k.f);
        if (ke) ke.classList.add('check');
      }
    }
  }
  // selection + legal
  if (selected){
    const se = squareEl(selected.r, selected.f);
    if (se) se.classList.add('selected');
    for (const m of legalForSelected){
      const e = squareEl(m.to.r, m.to.f);
      if (!e) continue;
      if (m.capture){
        const r = document.createElement('div'); r.className='cap-ring'; e.appendChild(r);
      } else {
        const d = document.createElement('div'); d.className='dot'; e.appendChild(d);
      }
    }
  }
  // cursor
  const ce = squareEl(cursor.r, cursor.f);
  if (ce) ce.classList.add('cursor');

  // turn banner
  if (G.result){
    turnBanner.textContent = '🏁 Game Over';
    turnBanner.classList.remove('black');
  } else if (G.side==='w'){
    turnBanner.textContent = "🤴 Mario's Turn";
    turnBanner.classList.remove('black');
  } else {
    turnBanner.textContent = "🐢 Bowser's Turn";
    turnBanner.classList.add('black');
  }
  // HUD active
  hudW.classList.toggle('active', G.side==='w' && !G.result && clockRunning && !paused);
  hudB.classList.toggle('active', G.side==='b' && !G.result && clockRunning && !paused);
  // captures
  renderCaptures();
  renderMoves();
  updateStatus();
}

function renderCaptures(){
  capByWhite.innerHTML='';
  capByBlack.innerHTML='';
  // accumulate captured pieces
  const byW = []; // pieces white captured (so they are black)
  const byB = [];
  for (const h of G.history){
    if (h.move.capture){
      const cap = h.captured;
      if (h.move._mover==='w') byW.push(cap);
      else byB.push(cap);
    }
  }
  byW.sort((a,b)=>VALUE[b.t]-VALUE[a.t]);
  byB.sort((a,b)=>VALUE[b.t]-VALUE[a.t]);
  for (const p of byW){
    const e = document.createElement('span');
    e.className = 'pc ' + p.c;
    e.textContent = ICON[p.c][p.t];
    capByWhite.appendChild(e);
  }
  for (const p of byB){
    const e = document.createElement('span');
    e.className = 'pc ' + p.c;
    e.textContent = ICON[p.c][p.t];
    capByBlack.appendChild(e);
  }
}

function renderMoves(){
  movesEl.innerHTML='';
  for (let i=0;i<G.history.length;i++){
    const h = G.history[i];
    if (i%2===0){
      const num = document.createElement('span');
      num.className='mvnum';
      num.textContent = (Math.floor(i/2)+1)+'.';
      movesEl.appendChild(num);
    }
    const mv = document.createElement('span');
    mv.className='mv';
    mv.textContent = h.san;
    movesEl.appendChild(mv);
  }
  movesEl.scrollTop = movesEl.scrollHeight;
}

function updateStatus(){
  statusEl.classList.remove('warn','win');
  if (G.result){
    statusEl.classList.add('win');
    statusEl.textContent = G.result.text;
    return;
  }
  const inChk = inCheck(G, G.side);
  if (inChk){
    statusEl.classList.add('warn');
    statusEl.textContent = 'Check! ' + (G.side==='w' ? 'Mario' : 'Bowser') + ' must respond.';
  } else {
    statusEl.textContent = (G.side==='w' ? 'Mario' : 'Bowser') + ' to move.';
  }
}

// =========================================================
// Game flow
// =========================================================
function onSquareClick(r,f){
  if (G.result) return;
  if (paused) return;
  if (promoPending) return;
  const piece = G.board[r][f];
  if (selected){
    // attempt move
    const mv = legalForSelected.find(m=>m.to.r===r && m.to.f===f);
    if (mv){
      // promotion: ask
      if (mv.promotion){
        // collect all promotion variants for this from-to
        const variants = legalForSelected.filter(m=>m.to.r===r && m.to.f===f && m.promotion);
        askPromotion(variants);
        return;
      }
      doMove(mv);
      return;
    }
    // switch selection if own piece
    if (piece && piece.c===G.side){
      selectSquare(r,f);
      return;
    }
    // otherwise deselect
    selected = null; legalForSelected=[];
    render();
    return;
  } else {
    if (piece && piece.c===G.side){
      selectSquare(r,f);
    }
  }
}

function selectSquare(r,f){
  selected = {r,f};
  legalForSelected = legalMovesFor(G, r, f);
  // dedupe: for promotion, we'll just include all and handle picker
  render();
}

let promoPending = null;
function askPromotion(variants){
  promoPending = variants;
  promoPicks.innerHTML='';
  const c = G.side;
  const order = ['Q','R','B','N'];
  for (const t of order){
    const v = variants.find(x=>x.promotion===t);
    if (!v) continue;
    const b = document.createElement('button');
    b.className = 'promoBtn ' + (c==='b'?'b':'');
    b.textContent = ICON[c][t];
    b.title = t;
    b.addEventListener('click', ()=>{
      promoOv.classList.remove('show');
      const chosen = variants.find(x=>x.promotion===t);
      promoPending = null;
      doMove(chosen);
    });
    promoPicks.appendChild(b);
  }
  promoOv.classList.add('show');
}

function doMove(m){
  // capture move details for SAN before applying
  const beforeBoard = copyBoard(G.board);
  // we need beforeState for SAN disambiguation: use a clone
  const beforeStateClone = {
    board: copyBoard(G.board),
    side: G.side,
    castling: {...G.castling},
    ep: G.ep ? {...G.ep} : null,
    halfmove: G.halfmove,
    fullmove: G.fullmove,
    history:[], posCounts:{}, result:null,
  };
  const mover = G.side;
  const undo = applyMove(G, m);
  // Now figure out check/mate for SAN suffix
  const opponent = G.side; // already toggled
  const opponentInCheck = inCheck(G, opponent);
  const opponentMoves = allLegalMoves(G);
  const isMate = opponentInCheck && opponentMoves.length===0;
  const isStalemate = !opponentInCheck && opponentMoves.length===0;
  let san = moveToSAN(beforeStateClone, m, beforeBoard, beforeStateClone);
  if (isMate) san += '#';
  else if (opponentInCheck) san += '+';
  // record
  m._mover = mover;
  const histRec = {
    move: m,
    san,
    captured: undo.captured,
    undo,
    timeWAfter: timeW,
    timeBAfter: timeB,
  };
  G.history.push(histRec);
  lastMove = m;
  // apply increment to mover's clock (not before first move started clock)
  if (clockRunning){
    if (mover==='w') timeW += incrementMs;
    else timeB += incrementMs;
  }
  // start clock on first white move
  if (!clockRunning && mover==='w'){
    clockRunning = true;
    lastTickTs = Date.now();
  } else {
    lastTickTs = Date.now(); // reset tick for new side
  }
  // hash count
  hashAndCount(G);

  // sound effects
  if (m.castle) Snd.castle();
  else if (m.promotion) Snd.promo();
  else if (m.capture) Snd.capture();
  else Snd.move();

  // outcome checks
  selected = null; legalForSelected=[];
  if (isMate){
    Snd.mate();
    setResult({type:'mate', winner:mover, text: (mover==='w'?'Checkmate — Mario wins! 🏆':'Checkmate — Bowser wins! 🐢')});
  } else if (isStalemate){
    setResult({type:'stalemate', winner:null, text:'Stalemate — Draw 🤝'});
  } else if (insufficientMaterial(G)){
    setResult({type:'draw', winner:null, text:'Draw — Insufficient Material'});
  } else if (G.halfmove >= 100){ // 50 full moves = 100 ply
    setResult({type:'draw', winner:null, text:'Draw — 50-move Rule'});
  } else {
    // threefold
    const h = positionHash(G);
    if (G.posCounts[h] >= 3){
      setResult({type:'draw', winner:null, text:'Draw — Threefold Repetition'});
    } else if (opponentInCheck){
      Snd.check();
    }
  }
  render();
}

function setResult(res){
  G.result = res;
  clockRunning = false;
  // show modal
  goTitle.textContent = res.text.split('—')[0].trim() || 'Game Over';
  goText.textContent = res.text;
  gameOv.classList.add('show');
  // coin shower
  startCoinShower();
}

// =========================================================
// Clock
// =========================================================
let timeControlMin = 10;
let incrementSec = 0;
let timeW = 10*60*1000;
let timeB = 10*60*1000;
let incrementMs = 0;
let clockRunning = false;
let paused = false;
let lastTickTs = 0;
let lastSecondTickedW = -1;
let lastSecondTickedB = -1;

function fmtTime(ms){
  if (ms<0) ms=0;
  const totalSec = Math.ceil(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return (m<10?'0':'')+m + ':' + (s<10?'0':'')+s;
}

function tickClock(){
  if (clockRunning && !paused && !G.result){
    const now = Date.now();
    const dt = now - lastTickTs;
    lastTickTs = now;
    if (G.side==='w'){
      timeW -= dt;
      if (timeW<=0){
        timeW=0;
        onFlag('w');
      }
    } else {
      timeB -= dt;
      if (timeB<=0){
        timeB=0;
        onFlag('b');
      }
    }
  }
  // update display
  timeWEl.textContent = fmtTime(timeW);
  timeBEl.textContent = fmtTime(timeB);
  hudW.classList.toggle('low', timeW < 30000 && timeW>0);
  hudB.classList.toggle('low', timeB < 30000 && timeB>0);
  hudW.classList.toggle('active', G.side==='w' && !G.result && clockRunning && !paused);
  hudB.classList.toggle('active', G.side==='b' && !G.result && clockRunning && !paused);
  // tick sound when in low time, once per second
  if (clockRunning && !paused && !G.result){
    if (G.side==='w' && timeW<30000 && timeW>0){
      const sec = Math.ceil(timeW/1000);
      if (sec !== lastSecondTickedW){ lastSecondTickedW = sec; Snd.tick(); }
    }
    if (G.side==='b' && timeB<30000 && timeB>0){
      const sec = Math.ceil(timeB/1000);
      if (sec !== lastSecondTickedB){ lastSecondTickedB = sec; Snd.tick(); }
    }
  }
  requestAnimationFrame(tickClock);
}
requestAnimationFrame(tickClock);

function onFlag(loser){
  clockRunning = false;
  const winner = loser==='w'?'b':'w';
  // check insufficient material for winner
  if (cannotMate(G, winner)){
    setResult({type:'draw', winner:null, text:'Draw — '+(loser==='w'?'Mario':'Bowser')+' flagged but '+(winner==='w'?'Mario':'Bowser')+' has insufficient material'});
  } else {
    setResult({type:'time', winner, text: 'Time out — ' + (winner==='w'?'Mario wins! 🏆':'Bowser wins! 🐢')});
  }
  render();
}

// =========================================================
// Buttons / controls
// =========================================================
const btnMute = document.getElementById('btnMute');
const btnPause = document.getElementById('btnPause');
const btnUndo = document.getElementById('btnUndo');
const btnNew = document.getElementById('btnNew');
const selMins = document.getElementById('selMins');
const selInc = document.getElementById('selInc');
const goPlayAgain = document.getElementById('goPlayAgain');

btnMute.addEventListener('click', ()=>{
  muted = !muted;
  btnMute.textContent = muted ? '🔇' : '🔊';
});

btnPause.addEventListener('click', togglePause);
function togglePause(){
  if (G.result) return;
  paused = !paused;
  if (paused){
    pausedOv.classList.add('show');
    btnPause.textContent = '▶ Resume';
  } else {
    pausedOv.classList.remove('show');
    btnPause.textContent = '⏸ Pause';
    lastTickTs = Date.now();
  }
}

btnUndo.addEventListener('click', undoLast);
function undoLast(){
  if (G.history.length===0) return;
  if (G.result){
    // allow undo from game over
    G.result = null;
    gameOv.classList.remove('show');
  }
  const rec = G.history.pop();
  // remove pos count
  const h = positionHash(G);
  if (G.posCounts[h]) G.posCounts[h]--;
  if (G.posCounts[h]<=0) delete G.posCounts[h];
  undoMove(G, rec.undo);
  // restore clock to before move? simplest: restore from prior history entry (or initial)
  if (G.history.length>0){
    const prev = G.history[G.history.length-1];
    timeW = prev.timeWAfter;
    timeB = prev.timeBAfter;
  } else {
    timeW = timeControlMin*60*1000;
    timeB = timeControlMin*60*1000;
    clockRunning = false;
  }
  // last move
  lastMove = G.history.length ? G.history[G.history.length-1].move : null;
  selected = null; legalForSelected=[];
  render();
}

btnNew.addEventListener('click', ()=>{
  if (G.history.length>0 && !G.result){
    if (!confirm('Start a new game? Current game will be lost.')) return;
  }
  newGame();
});
goPlayAgain.addEventListener('click', ()=>{ gameOv.classList.remove('show'); newGame(); });

function newGame(){
  G = createInitialState();
  hashAndCount(G);
  timeControlMin = parseInt(selMins.value, 10);
  incrementSec = parseInt(selInc.value, 10);
  incrementMs = incrementSec * 1000;
  timeW = timeControlMin*60*1000;
  timeB = timeControlMin*60*1000;
  clockRunning = false;
  paused = false;
  pausedOv.classList.remove('show');
  btnPause.textContent = '⏸ Pause';
  selected = null; legalForSelected=[]; lastMove=null;
  cursor={r:1,f:4};
  lastSecondTickedW=-1; lastSecondTickedB=-1;
  stopCoinShower();
  gameOv.classList.remove('show');
  render();
}

// =========================================================
// Keyboard
// =========================================================
document.addEventListener('keydown', (e)=>{
  if (e.code==='Space'){
    e.preventDefault();
    togglePause();
    return;
  }
  if (e.key==='u' || e.key==='U'){ undoLast(); return; }
  if (e.key==='Escape'){ selected=null; legalForSelected=[]; render(); return; }
  if (paused || G.result || promoPending) return;
  if (e.key==='ArrowUp'){ cursor.r = Math.min(7, cursor.r+1); render(); }
  else if (e.key==='ArrowDown'){ cursor.r = Math.max(0, cursor.r-1); render(); }
  else if (e.key==='ArrowLeft'){ cursor.f = Math.max(0, cursor.f-1); render(); }
  else if (e.key==='ArrowRight'){ cursor.f = Math.min(7, cursor.f+1); render(); }
  else if (e.key==='Enter'){
    onSquareClick(cursor.r, cursor.f);
  }
});

// =========================================================
// Coin shower
// =========================================================
let coinTimers = [];
function startCoinShower(){
  stopCoinShower();
  const wrap = document.getElementById('boardWrap');
  const symbols = ['🪙','⭐','🍄','🌟','💰'];
  for (let i=0;i<60;i++){
    const t = setTimeout(()=>{
      const c = document.createElement('div');
      c.className='coin';
      c.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      c.style.left = (Math.random()*100)+'%';
      c.style.top = '-30px';
      c.style.animationDuration = (1.6 + Math.random()*1.6)+'s';
      wrap.appendChild(c);
      setTimeout(()=>c.remove(), 4000);
    }, i*60);
    coinTimers.push(t);
  }
}
function stopCoinShower(){
  for (const t of coinTimers) clearTimeout(t);
  coinTimers=[];
  document.querySelectorAll('.coin').forEach(c=>c.remove());
}

// initial render
render();
